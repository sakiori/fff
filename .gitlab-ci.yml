# Pipelines of sakiori-oss/fff on GitLab.com. CUSTOM.md describes the release process and the
# project settings it relies on.
#
# - Merge request: fmt, clippy, lint-mcp, ci-scripts, native-tests, node-tests and node-contract
#   on Linux, mr-title when the merge request lands squashed, and check-build-linux, the Linux
#   release builds, when a change can affect the build.
# - Push to main: macos-tests, the native suite on the macOS runner.
# - Schedule on main: git-intake-sync takes upstream through a merge request, and release-tag
#   checks the tip's contract and cuts the next v<x.y.z> on it when its commits ask for one, once
#   compute-quota finds the group's compute minutes enough for publish-npm.
# - Release tag: release-check, release-version, build-linux, build-darwin and macos-tests,
#   pack-npm, sign, publish-npm, publish, and release last: the GitLab Release.
# - Started by hand on main: a rehearsal of a release with the version <x.y.z>-rehearsal.<day>,
#   whose rehearse-npm only reads the registry; nothing is signed or published.
#
# Linux jobs run on the group's x86_64 Linux runner, tagged sakiori-oss-linux, except
# publish-npm, which npm's trusted publishing keeps on GitLab.com's shared runners. Apple's SDK
# may be used only on Apple hardware, so darwin targets build natively on the forks' Apple
# silicon runner, which takes this project's jobs tagged sakiori-oss-macos only from protected
# refs and runs each in a disposable macOS virtual machine. Release
# jobs run only in this project. Tools are pinned by version and SHA-256 in
# .gitlab/scripts/install-tools.sh, images by digest.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # The Linux runner keeps a working copy that merge request jobs also use, so a release clones.
    - if: $CI_COMMIT_TAG =~ /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/
      variables:
        GIT_STRATEGY: clone
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE =~ /^(push|schedule|web|api)$/
  auto_cancel:
    on_new_commit: none

stages:
  - check
  - build
  - pack
  - sign
  - publish
  - release

variables:
  GIT_DEPTH: "1"
  # The toolchain of every job; rust-toolchain.toml asks for the current stable, which CI pins.
  RUSTUP_TOOLCHAIN: "1.98.1"
  RUST_IMAGE: rust:1.98.1-trixie@sha256:a8a5f0a1e5fe7dfe1d352591e4a1c7dd2c08fd70475cae872cf3458ba0df0546
  # Cirrus Labs' macOS 26 base image with the Xcode Command Line Tools, gitlab-runner and Rosetta.
  MACOS_IMAGE: ghcr.io/cirruslabs/macos-tahoe-base@sha256:4aaa751fa7538902d73c767f27a066fc87e83f183069da4e4b5022863abd4c77
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  CARGO_TERM_COLOR: always
  TOOLS: $CI_PROJECT_DIR/.tools
  # The git-intake release the release jobs install, with its x86_64-unknown-linux-musl
  # archive's SHA-256.
  GIT_INTAKE_VERSION: "0.5.3"
  GIT_INTAKE_SHA256_X86_64_LINUX: c9cbd2c32e2651454648f163f438865351a28fe395aab773b380d47bc204f90d

default:
  image: $RUST_IMAGE
  tags:
    - sakiori-oss-linux
  interruptible: false
  retry:
    max: 1
    when:
      - runner_system_failure
      - runner_external_dependency_failure
      - runner_interrupted
      - stuck_pending_with_matching_runners
      - stuck_pending_no_matching_runners
      - no_updates_running
      - no_updates_canceling

# Zig for zlob, and libclang, which zlob's bindgen loads, from the image's Debian release.
.zig:
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends libclang-dev > /dev/null
    - .gitlab/scripts/install-tools.sh "$TOOLS" zig
    - export PATH="$TOOLS/bin:$PATH"
    - zig version
    - cargo --version

.check:
  extends: .zig
  stage: check
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  cache:
    key:
      files:
        - Cargo.lock
      prefix: $CI_JOB_NAME_SLUG
    paths:
      - .cargo/registry/index
      - .cargo/registry/cache
      - target/

fmt:
  extends: .check
  before_script:
    - rustup component add rustfmt
  cache: []
  script:
    - cargo fmt --all -- --check

clippy:
  extends: .check
  script:
    - rustup component add clippy
    - cargo clippy --no-default-features --features zlob -- -D warnings

lint-mcp:
  extends: .check
  script:
    - rustup component add clippy
    - make lint-mcp

# The pipeline's scripts: executable in git, shellcheck clean, and the Zig pin upstream's.
ci-scripts:
  extends: .check
  before_script: []
  cache: []
  script:
    - |
      plain=$(git ls-files -s -- '.gitlab/scripts/*.sh' | grep -v '^100755 ' || true)
      [ -z "$plain" ] || { printf 'not executable in git (git update-index --chmod=+x):\n%s\n' "$plain" >&2; exit 1; }
    - .gitlab/scripts/install-tools.sh "$TOOLS" shellcheck
    - '"$TOOLS/bin/shellcheck" .gitlab/scripts/*.sh'
    - .gitlab/scripts/check-zig-pin.sh

# The full test suite with the OS event service behind the watchers (inotify here): no polling
# interval and no skipped tests, unlike the checks of .git-intake.toml.
native-tests:
  extends: .check
  timeout: 1h
  script:
    - make test-rust
    - make test-mcp

# The Node package's contract: its API report is current, and the change the commits of the
# commit the merge request lands ask for covers the contract's change since the previous release.
# The contract check runs git intake, which reads the full history; it compares with the release
# tags, which the job fetches with the target branch. Also the tests of the release scripts.
node-contract:
  extends: .check
  variables:
    GIT_DEPTH: "0"
  before_script:
    - .gitlab/scripts/install-tools.sh "$TOOLS" node git-intake
    - export PATH="$TOOLS/bin:$PATH"
  cache: []
  script:
    - (cd packages && npm ci --workspace fff-node --ignore-scripts --no-audit --no-fund)
    - git fetch --quiet --no-tags --prune origin '+refs/tags/v*:refs/tags/v*'
      "+refs/heads/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME:refs/remotes/origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - make sync-js-api-check
    - make node-api-check
    - make test-ci-scripts
    - make node-contract-check

# A merge request that lands squashed lands its title as the subject git intake versions the next
# release by, so the title is a Conventional Commit. The update's merge requests land unsquashed.
mr-title:
  extends: .check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SQUASH_ON_MERGE == "true"
  before_script:
    - .gitlab/scripts/install-tools.sh "$TOOLS" node
    - export PATH="$TOOLS/bin:$PATH"
  cache: []
  script:
    - (cd .gitlab/scripts && npm ci --ignore-scripts --no-audit --no-fund)
    # The title without GitLab's draft prefix, which it drops when the merge request is ready.
    - |
      node .gitlab/scripts/mr-title.mjs "$CI_MERGE_REQUEST_TITLE" |
        .gitlab/scripts/node_modules/.bin/commitlint --config .gitlab/scripts/commitlint.config.mjs || {
        echo "commitlint's lines above name the rules the title breaks. It must be a Conventional Commit, <type>[(<scope>)][!]: <description>, such as fix(watch): …; CUSTOM.md, Merge request titles, lists the rules." >&2
        exit 1
      }

# The Node package's tests against a release build of libfff_c and fff-mcp.
node-tests:
  extends: .check
  timeout: 1h
  script:
    - .gitlab/scripts/install-tools.sh "$TOOLS" node
    - node --version
    - (cd packages && npm ci --workspace fff-node --ignore-scripts --no-audit --no-fund)
    - make test-node

# git-intake from its release archive, for the jobs that run it; they need the full history.
.git-intake:
  variables:
    GIT_DEPTH: "0"
  before_script:
    - .gitlab/scripts/install-tools.sh "$TOOLS" git-intake
    - export PATH="$TOOLS/bin:$PATH"

# The schedule's jobs push and open merge requests with GITLAB_TOKEN, the token of the group's
# release bot, whose pushes start pipelines. The variable is scoped to the git-intake
# environment, which only these jobs name.
.git-intake-bot:
  stage: check
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_PROJECT_PATH == "sakiori-oss/fff"
  environment:
    name: git-intake
    action: prepare
  variables:
    GIT_DEPTH: "0"
    GIT_STRATEGY: clone
  before_script:
    - '[ -n "${GITLAB_TOKEN:-}" ] || { echo "GITLAB_TOKEN is not set; CUSTOM.md, Project settings, describes it" >&2; exit 1; }'
    - .gitlab/scripts/install-tools.sh "$TOOLS" git-intake
    - export PATH="$TOOLS/bin:$PATH"
    - git config user.name Sakiori
    - git config user.email oss@sakiori.app
    - git remote set-url origin "$CI_PROJECT_URL.git"
    # The runner's own git configuration, included from the clone's and from the
    # global one, carries the job token: a rewrite of the server's URLs into ones
    # with the token, and a credential helper. The job drops both and answers
    # with GITLAB_TOKEN alone, to this server alone.
    - export GIT_CONFIG_GLOBAL="$(mktemp)"
    - git config --local --unset-all include.path || true
    - git config --unset-all credential.helper || true
    - git config --add "credential.$CI_SERVER_URL.helper" ''
    - git config --add "credential.$CI_SERVER_URL.helper" '!f() { echo username=oauth2; echo "password=$GITLAB_TOKEN"; }; f'
    - |
      case "$(git remote get-url --push origin)" in
        *@*) echo "git rewrites the push URL to carry credentials; it must reach the server without them" >&2; exit 1 ;;
      esac
      answer=$(printf 'url=%s\n\n' "$CI_PROJECT_URL.git" | GIT_TERMINAL_PROMPT=0 git credential fill | sed -n 's/^password=//p')
      [ "$answer" = "$GITLAB_TOKEN" ] || { echo "git answers the server with a credential other than GITLAB_TOKEN" >&2; exit 1; }

git-intake-sync:
  extends: .git-intake-bot
  resource_group: git-intake-sync
  script:
    - git intake sync

# publish-npm is the only job on GitLab.com's shared runners, and the group's compute quota pays
# for it. A release whose npm job cannot run is not cut. COMPUTE_QUOTA_TOKEN is scoped to the
# compute-quota environment, which only this job names.
compute-quota:
  stage: check
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_PROJECT_PATH == "sakiori-oss/fff"
  environment:
    name: compute-quota
    action: prepare
  cache: []
  variables:
    GIT_STRATEGY: clone
    # publish-npm takes under two minutes; the rest covers a retry.
    PUBLISH_NPM_MINUTES: "10"
  script:
    - .gitlab/scripts/install-tools.sh "$TOOLS" jq
    - export PATH="$TOOLS/bin:$PATH"
    - .gitlab/scripts/check-compute-quota.sh "$PUBLISH_NPM_MINUTES"

# The contract check runs on the tip first: a release cut after a merge request's pipeline can
# change the release that pipeline compared with, so release-tag cuts nothing the tip does not mark.
release-tag:
  extends: .git-intake-bot
  needs:
    - job: compute-quota
  resource_group: release-tag
  script:
    - .gitlab/scripts/install-tools.sh "$TOOLS" node
    - git fetch --quiet --no-tags --prune origin '+refs/tags/v*:refs/tags/v*'
      "+refs/heads/$CI_DEFAULT_BRANCH:refs/remotes/origin/$CI_DEFAULT_BRANCH"
    - git checkout --quiet --detach "origin/$CI_DEFAULT_BRANCH"
    - node .gitlab/scripts/contract-check.mjs
    - git intake release tag

# A release builds nothing before its tag passes the check; the notes are written with it.
release-check:
  extends: .git-intake
  stage: check
  needs: []
  rules:
    - if: $CI_COMMIT_TAG && $CI_PROJECT_PATH == "sakiori-oss/fff"
  script:
    - git intake release check
    - git intake release notes > release-notes.md
    - cat release-notes.md
  artifacts:
    paths:
      - release-notes.md
    expire_in: 30 days

# The version of every build and package: RELEASE_VERSION, the tag's x.y.z or a rehearsal's
# <x.y.z>-rehearsal.<YYYYMMDD>, and RELEASE_UPSTREAM, the upstream release it carries.
release-version:
  extends: .git-intake
  stage: check
  needs:
    - job: release-check
      optional: true
  rules:
    - if: $CI_COMMIT_TAG && $CI_PROJECT_PATH == "sakiori-oss/fff"
    - if: $CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $CI_PROJECT_PATH == "sakiori-oss/fff"
  script:
    - git intake release version --dotenv > release.env
    - cat release.env
  artifacts:
    reports:
      dotenv: release.env

# Each build leaves the native files of its platform package in native/ and, for musl and
# darwin, the fff-mcp archive in dist/ (build-release.sh).
.build-linux:
  extends: .zig
  stage: build
  timeout: 1h
  parallel:
    matrix:
      - TARGET:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
  script:
    - .gitlab/scripts/install-tools.sh "$TOOLS" cargo-zigbuild
    - if [ -n "${RELEASE_VERSION:-}" ]; then .gitlab/scripts/stamp-version.sh "$RELEASE_VERSION+$RELEASE_UPSTREAM"; fi
    - .gitlab/scripts/build-release.sh "$TARGET"
  artifacts:
    paths:
      - dist/
      - native/
    expire_in: 30 days

# A merge request that can change the build builds every Linux target with the committed
# version, so a release never meets a broken build for the first time.
check-build-linux:
  extends: .build-linux
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - Cargo.toml
          - Cargo.lock
          - crates/*/Cargo.toml
          - crates/*/build.rs
          - .cargo/config.toml
          - .gitlab/scripts/**/*
          - .gitlab-ci.yml
          - mise.toml
          - rust-toolchain.toml
        compare_to: refs/heads/main
  cache:
    key:
      files:
        - Cargo.lock
      prefix: build-$TARGET
    paths:
      - .cargo/registry/index
      - .cargo/registry/cache
      - target/

# A release build depends on the tag's commit and the pinned image and tools only, so it
# restores no cache.
build-linux:
  extends: .build-linux
  needs:
    - job: release-version
  rules:
    - if: $CI_COMMIT_TAG && $CI_PROJECT_PATH == "sakiori-oss/fff"
    - if: $CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $CI_PROJECT_PATH == "sakiori-oss/fff"
  cache: []

# Jobs of the macOS runner. Each runs in a virtual machine cloned from MACOS_IMAGE and deleted
# after it, which caches nothing; the pinned rustup-init installs the toolchain into the job.
.macos:
  image: $MACOS_IMAGE
  tags:
    - sakiori-oss-macos
  cache: []
  variables:
    GIT_STRATEGY: clone
    RUSTUP_HOME: $CI_PROJECT_DIR/.rustup
  before_script:
    # The runner refuses any other job before it starts a virtual machine; the job does again.
    - |
      [ "${CI_COMMIT_REF_PROTECTED:-}" = true ] || { echo "the macOS runner takes protected refs only" >&2; exit 1; }
    - .gitlab/scripts/install-tools.sh "$TOOLS" rustup zig node
    - env -u RUSTUP_TOOLCHAIN "$TOOLS/bin/rustup-init" -y --quiet --no-modify-path --profile minimal --default-toolchain none
    - export PATH="$CARGO_HOME/bin:$TOOLS/bin:$PATH"
    - rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
    - zig version
    - cargo --version

build-darwin:
  extends: .macos
  stage: build
  needs:
    - job: release-version
  rules:
    - if: $CI_COMMIT_TAG && $CI_PROJECT_PATH == "sakiori-oss/fff"
    - if: $CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $CI_PROJECT_PATH == "sakiori-oss/fff"
  timeout: 1h
  parallel:
    matrix:
      - TARGET:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
  script:
    - .gitlab/scripts/stamp-version.sh "$RELEASE_VERSION+$RELEASE_UPSTREAM"
    - .gitlab/scripts/build-release.sh "$TARGET"
  artifacts:
    paths:
      - dist/
      - native/
    expire_in: 30 days

# The full native suite with FSEvents, no polling and no skips, and the Node package's tests,
# for every push to main, rehearsal and release; a release publishes nothing before it passes.
macos-tests:
  extends: .macos
  stage: check
  needs: []
  rules:
    - if: $CI_COMMIT_TAG && $CI_PROJECT_PATH == "sakiori-oss/fff"
    - if: $CI_PIPELINE_SOURCE =~ /^(push|web|api)$/ && $CI_PROJECT_PATH == "sakiori-oss/fff"
  timeout: 2h
  script:
    - make test-rust
    - make test-mcp
    - (cd packages && npm ci --workspace fff-node --ignore-scripts --no-audit --no-fund)
    - make test-node

# The npm tarballs of @sakiori/fff-node and its six platform packages.
pack-npm:
  stage: pack
  needs:
    - job: build-linux
      artifacts: true
    - job: build-darwin
      artifacts: true
    - job: release-version
  rules:
    - if: $CI_COMMIT_TAG && $CI_PROJECT_PATH == "sakiori-oss/fff"
    - if: $CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $CI_PROJECT_PATH == "sakiori-oss/fff"
  script:
    - .gitlab/scripts/install-tools.sh "$TOOLS" node
    - export PATH="$TOOLS/bin:$PATH"
    - .gitlab/scripts/pack-npm.sh
  artifacts:
    paths:
      - dist-npm/
    expire_in: 30 days

# The only job besides publish-npm that holds an ID token for Sigstore; it runs no build code.
sign:
  stage: sign
  needs:
    - job: build-linux
      artifacts: true
    - job: build-darwin
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG && $CI_PROJECT_PATH == "sakiori-oss/fff"
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  script:
    - .gitlab/scripts/install-tools.sh "$TOOLS" cosign
    - export PATH="$TOOLS/bin:$PATH"
    - .gitlab/scripts/sign.sh
  artifacts:
    paths:
      - dist/
    expire_in: 30 days

.npm:
  stage: publish
  script:
    - .gitlab/scripts/install-tools.sh "$TOOLS" node
    - export PATH="$TOOLS/bin:$PATH"
    - npm --version
    - node .gitlab/scripts/publish-npm.mjs $PUBLISH_NPM_FLAGS

# npm publishes with trusted publishing, which works only on GitLab.com's shared runners, and
# with provenance; NPM_TOKEN, scoped to the npm environment, exists only for a first publish.
# One release publishes at a time: the npm packages, the registry files, then the Release.
publish-npm:
  extends: .npm
  tags:
    - saas-linux-small-amd64
  needs:
    - job: pack-npm
      artifacts: true
    - job: release-version
    - job: macos-tests
      artifacts: false
    - job: sign
      artifacts: false
  rules:
    - if: $CI_COMMIT_TAG && $CI_PROJECT_PATH == "sakiori-oss/fff"
  environment:
    name: npm
    action: prepare
  resource_group: release-publish
  id_tokens:
    NPM_ID_TOKEN:
      aud: npm:registry.npmjs.org
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  variables:
    PUBLISH_NPM_FLAGS: ""

# A rehearsal reports per package whether a release would publish or skip it, and fails where
# a release's publish would.
rehearse-npm:
  extends: .npm
  needs:
    - job: pack-npm
      artifacts: true
    - job: release-version
    - job: macos-tests
      artifacts: false
  rules:
    - if: $CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $CI_PROJECT_PATH == "sakiori-oss/fff"
  variables:
    PUBLISH_NPM_FLAGS: --check

publish:
  stage: publish
  needs:
    - job: sign
      artifacts: true
    - job: publish-npm
      artifacts: false
    - job: macos-tests
      artifacts: false
  rules:
    - if: $CI_COMMIT_TAG && $CI_PROJECT_PATH == "sakiori-oss/fff"
  resource_group: release-publish
  script:
    - .gitlab/scripts/install-tools.sh "$TOOLS" jq
    - export PATH="$TOOLS/bin:$PATH"
    - .gitlab/scripts/publish.sh
  artifacts:
    paths:
      - release-links.json
    expire_in: 30 days

# The last job: the release is published once its GitLab Release exists.
release:
  stage: release
  needs:
    - job: release-check
      artifacts: true
    - job: publish
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG && $CI_PROJECT_PATH == "sakiori-oss/fff"
  resource_group: release-publish
  script:
    - .gitlab/scripts/install-tools.sh "$TOOLS" glab jq
    - export PATH="$TOOLS/bin:$PATH"
    - .gitlab/scripts/release.sh

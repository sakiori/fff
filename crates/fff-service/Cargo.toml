[package]
name = "fff-service"
version = "0.11.0"
edition = "2024"
description = "Client, protocol and namespace of the shared fff service"
license = "MIT"

[lints]
workspace = true

# Walker backends change what the service indexes, so they are part of its build identity.
[features]
ripgrep = []
zlob = []

[dependencies]
interprocess = { version = "2.4", features = ["tokio"] }
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
blake3 = { workspace = true }
libc = "0.2"
rustix = { version = "1.1", features = ["fs", "net", "process"] }

[target.'cfg(windows)'.dependencies]
dunce = { workspace = true }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Console",
] }

[build-dependencies]
blake3 = { workspace = true }

[dev-dependencies]
tempfile = "3.8"

